version: '3.8'

services:
  earth-jukebox-backend:
    build: .
    container_name: earth_jukebox_api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./data:/workspace/data
      - ./artifacts:/workspace/artifacts
    restart: unless-stopped